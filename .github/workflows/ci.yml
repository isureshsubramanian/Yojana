name: ci
on:
  push:
  pull_request:
jobs:
  build-test-gate:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: Yojana!Ci2026
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Yojana!Ci2026' -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make restore
      - run: make web-install
      - run: make web
      - run: make build
      - run: make test
      - name: Database tests
        env:
          YOJANA_TEST_SQL: "Server=localhost,1433;Database=yojana_ci;User Id=sa;Password=Yojana!Ci2026;Encrypt=True;TrustServerCertificate=True"
        run: make test-db
      - name: Gates (licence policy, notices up to date, name audit, bundle budget)
        run: make gate
      - name: Gates fail on planted violations
        run: make self-test
      - name: Largest contentful paint budget (real browser, 10 Mbit link)
        env:
          YOJANA_TEST_SQL: "Server=localhost,1433;Database=yojana_ci;User Id=sa;Password=Yojana!Ci2026;Encrypt=True;TrustServerCertificate=True"
          Platform__ConnectionString: "Server=localhost,1433;Database=yojana_ci;User Id=sa;Password=Yojana!Ci2026;Encrypt=True;TrustServerCertificate=True"
          Platform__MigrateOnStartup: "true"
          Platform__AutoBuildMessageStorage: "true"
          ASPNETCORE_URLS: http://localhost:5080
        run: |
          dotnet run --project src/Web/Yojana.Web -c Debug --no-build -- --seed
          dotnet run --project src/Web/Yojana.Web -c Debug --no-build &
          for i in $(seq 1 60); do curl -fsS http://localhost:5080/health >/dev/null 2>&1 && break; sleep 1; done
          make web-lcp
