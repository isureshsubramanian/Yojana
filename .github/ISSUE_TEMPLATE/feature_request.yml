name: Feature request
description: Suggest a new capability or a change in behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation in your business, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: good
    attributes:
      label: What would good look like?
      description: An example with real-world-shaped data helps a lot.
    validations:
      required: true
  - type: textarea
    id: notthis
    attributes:
      label: What must it not do?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
