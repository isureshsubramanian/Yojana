<!DOCTYPE html>
<html lang="en" data-theme="glass">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Yojana</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232250d9'/%3E%3Cpath d='M9 8l7 9 7-9M16 17v8' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
<script>
/* Mode before first paint: the saved explicit override wins; otherwise the OS preference applies through CSS.
   The same key is read and written by src/theme/mode.ts (the only module that touches data-mode). */
(function(){try{var m=localStorage.getItem('yj-mode');if(m==='dark'||m==='light')document.documentElement.dataset.mode=m;}catch(e){}})();
</script>
<!--@assets-->
</head>
<body>
<div id="root"></div>
<noscript>Yojana needs JavaScript enabled.</noscript>
</body>
</html>
